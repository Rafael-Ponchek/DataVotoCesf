```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa - DataVotoCesf</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #243447;
        }

        h1, h2 {
            text-align: center;
        }

        .login-container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000018;
        }

        .login-container input {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;

        button, .botao-voltar {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .botao-entrar {
            background: #294161;
            color: white;
        }

        .botao-entrar:hover {
            background: #1c3049;
        }

        .botao-voltar {
            background: #6c757d;
            color: white;
        }

        .botao-voltar:hover {
            background: #565e64;
        }

        #painel {
            display: none;
        }

            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;

        .controles input {
            flex: 1;
            min-width: 220px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .botao-atualizar {
            width: auto;
            background: #294161;
            color: white;
        }

        .botao-excluir-todos {
            width: auto;
            background: #b42318;
            color: white;
        }

        .botao-sair {
            width: auto;
            background: #6c757d;
            color: white;
        }

        .tabela-container {
            width: 100%;
            max-height: 72vh;
            overflow: auto;

            border-radius: 8px;
            border: 1px solid #d9dee7;
        }

        table {
            width: 100%;

        th, td {
            padding: 18px 20px;

</head>

<body>

    <section id="login" class="login-container">
        <h1>Área administrativa</h1>
        <p>Digite a senha para acessar as respostas.</p>

        <form id="formLogin">
            <input
                type="password"
                id="senhaAdmin"
                placeholder="Senha de administrador"
                required
            >

            <button type="submit" class="botao-entrar">
                Entrar
            </button>

            <a href="index.html" class="botao-voltar">
                Voltar à página inicial
            </a>
        </form>

        <p id="mensagemLogin" class="mensagem"></p>
    </section>

    <main id="painel">
        <h1>Respostas do DataVotoCesf</h1>

        <div class="controles">
            <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar nas respostas..."
            >

            <button id="atualizar" class="botao-atualizar" type="button">
                Atualizar respostas
            </button>

            <button id="excluirTodos" class="botao-excluir-todos" type="button">
                Excluir todas
            </button>

            <button id="sair" class="botao-sair" type="button">
                Sair
            </button>
        </div>

        <p id="status" class="mensagem">Carregando respostas...</p>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr id="cabecalho"></tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            onValue,
            remove
        } from
            "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDqXGQcAPyZ37Pnl7bFmbqzNfv3a6SjCXE",
            authDomain: "data-voto-cesf2.firebaseapp.com",
            databaseURL: "https://data-voto-cesf2-default-rtdb.firebaseio.com",
            projectId: "data-voto-cesf2",
            storageBucket: "data-voto-cesf2.firebasestorage.app",
            messagingSenderId: "724147999457",
            appId: "1:724147999457:web:3254dbc2eea62aeb969da0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const respostasRef = ref(db, "respostas");

        const login = document.getElementById("login");
        const painel = document.getElementById("painel");
        const formLogin = document.getElementById("formLogin");
        const senhaAdmin = document.getElementById("senhaAdmin");
        const mensagemLogin = document.getElementById("mensagemLogin");
        const pesquisa = document.getElementById("pesquisa");
        const cabecalho = document.getElementById("cabecalho");
        const corpoTabela = document.getElementById("corpoTabela");
        const status = document.getElementById("status");

        let respostas = {};
        let cancelarEscuta = null;

        // A senha abaixo é apenas uma barreira visual para demonstração.
        // Ela não protege os dados do Firebase de forma segura.
        formLogin.addEventListener("submit", (event) => {
            event.preventDefault();

            if (senhaAdmin.value === "1322") {
                login.style.display = "none";
                painel.style.display = "block";
                mensagemLogin.textContent = "";
                iniciarLeitura();
            } else {
                mensagemLogin.textContent = "Senha incorreta.";
                senhaAdmin.value = "";
            }
        });

        function iniciarLeitura() {
            if (cancelarEscuta) {
                cancelarEscuta();
            }

            status.textContent = "Carregando respostas...";

            cancelarEscuta = onValue(
                respostasRef,
                (snapshot) => {
                    respostas = snapshot.val() || {};
                    montarTabela();
                },
                (erro) => {
                    status.textContent =
                        "Erro ao carregar respostas: " + erro.message;
                }
            );
        }

        function montarTabela() {
            cabecalho.replaceChildren();
            corpoTabela.replaceChildren();

            const registros = Object.entries(respostas);
            const termo = pesquisa.value.trim().toLowerCase();

            if (registros.length === 0) {
                status.textContent = "Nenhuma resposta encontrada no Firebase.";
                return;
            }

            const campos = new Set();

            registros.forEach(([id, dados]) => {
                if (dados && typeof dados === "object") {
                    Object.keys(dados).forEach((campo) => campos.add(campo));
                }
            });

            const colunas = ["ID", ...campos, "Ações"];

            colunas.forEach((coluna) => {
                const th = document.createElement("th");
                th.textContent = coluna;
                cabecalho.appendChild(th);
            });

            let exibidas = 0;

            registros.forEach(([id, dados]) => {
                const textoPesquisa =
                    JSON.stringify(dados).toLowerCase() + " " + id.toLowerCase();

                if (termo && !textoPesquisa.includes(termo)) {
                    return;
                }

                const linha = document.createElement("tr");

                const celulaId = document.createElement("td");
                celulaId.textContent = id;
                linha.appendChild(celulaId);

                campos.forEach((campo) => {
                    const celula = document.createElement("td");
                    const valor = dados?.[campo];

                    if (Array.isArray(valor)) {
                        celula.textContent = valor.join(", ");
                    } else if (valor && typeof valor === "object") {
                        celula.textContent = JSON.stringify(valor);
                    } else {
                        celula.textContent = valor == null ? "" : String(valor);
                    }

                    linha.appendChild(celula);
                });

                const celulaAcao = document.createElement("td");
                const botaoExcluir = document.createElement("button");

                botaoExcluir.type = "button";
                botaoExcluir.className = "botao-excluir";
                botaoExcluir.textContent = "Excluir";

                botaoExcluir.addEventListener("click", async () => {
                    const confirmar = confirm(
                        "Tem certeza de que deseja excluir esta resposta?"
                    );

                    if (!confirmar) return;

                    try {
                        await remove(ref(db, "respostas/" + id));
                        status.textContent = "Resposta excluída.";
                    } catch (erro) {
                        alert("Não foi possível excluir: " + erro.message);
                    }
                });

                celulaAcao.appendChild(botaoExcluir);
                linha.appendChild(celulaAcao);
                corpoTabela.appendChild(linha);
                exibidas++;
            });

            status.textContent =
                `${exibidas} resposta(s) exibida(s) de ${registros.length}.`;
        }

        pesquisa.addEventListener("input", montarTabela);

        document.getElementById("atualizar").addEventListener("click", () => {
            montarTabela();
        });

        document.getElementById("excluirTodos").addEventListener("click", async () => {
            if (Object.keys(respostas).length === 0) {
                alert("Não existem respostas para excluir.");
                return;
            }

            const confirmar = confirm(
                "Atenção: deseja realmente excluir TODAS as respostas?"
            );

            if (!confirmar) return;

            try {
                await remove(respostasRef);
                status.textContent = "Todas as respostas foram excluídas.";
            } catch (erro) {
                alert("Não foi possível excluir as respostas: " + erro.message);
            }
        });

        document.getElementById("sair").addEventListener("click", () => {
            if (cancelarEscuta) {
                cancelarEscuta();
                cancelarEscuta = null;
            }

            painel.style.display = "none";
            login.style.display = "block";
            senhaAdmin.value = "";
            pesquisa.value = "";
            mensagemLogin.textContent = "";
        });
    </script>

</body>
</html>
