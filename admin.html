<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa - DataVotoCesf</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #243447;
        }

        h1, h2 {
            text-align: center;
        }

        .login-container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000018;
        }

        .login-container input {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .botoes-login {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }

        .botoes-login button,
        .botoes-login .botao-voltar {
            flex: 1;
            min-width: 0;
            height: 45px;
            margin: 0;
            padding: 10px 5px;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .botao-entrar {
            background-color: #294161;
            color: white;
        }

        .botao-entrar:hover {
            background-color: #1c3049;
        }

        .botao-voltar {
            background-color: #b42318;
            color: white;
        }

        .botao-voltar:hover {
            background-color: #8f1c13;
        }

        #painel {
            display: none;
        }

        .controles {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        .controles input {
            flex: 1;
            min-width: 220px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .controles button {
            width: auto;
            padding: 12px 16px;
            margin: 0;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
        }

        .botao-atualizar {
            background: #294161;
            color: white;
        }

        .botao-excluir-todos,
        .botao-excluir {
            background: #b42318;
            color: white;
        }

        .botao-sair {
            background: #6c757d;
            color: white;
        }

        .tabela-container {
            width: 100%;
            max-height: 72vh;
            overflow: auto;
            background: white;
            border-radius: 8px;
            border: 1px solid #d9dee7;
        }

        table {
            width: 100%;
            min-width: 1600px;
            border-collapse: collapse;
            font-size: 16px;
        }

        th, td {
            padding: 18px 20px;
            text-align: left;
            vertical-align: top;
            border: 1px solid #d9dee7;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #294161;
            color: white;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background: #f5f7fa;
        }

        tbody tr:hover {
            background: #e8eef6;
        }

        .botao-excluir {
            min-width: 100px;
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .mensagem {
            margin: 15px 0;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .login-container {
                margin: 30px auto;
                padding: 22px;
            }

            .botoes-login {
                gap: 8px;
            }

            .botoes-login button,
            .botoes-login .botao-voltar {
                font-size: 12px;
                padding: 8px 3px;
            }

            .controles {
                flex-direction: column;
            }

            .controles input,
            .controles button {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>

<body>

    <section id="login" class="login-container">
        <h1>Área administrativa</h1>
        <p>Digite a senha para acessar as respostas.</p>

        <form id="formLogin">
            <input
                type="password"
                id="senhaAdmin"
                placeholder="Senha de administrador"
                required
            >

            <div class="botoes-login">
                <button type="submit" class="botao-entrar">
                    Entrar
                </button>

                <a href="index.html" class="botao-voltar">
                    Voltar à página inicial
                </a>
            </div>
        </form>

        <p id="mensagemLogin" class="mensagem"></p>
    </section>

    <main id="painel">
        <h1>Respostas do DataVotoCesf</h1>

        <div class="controles">
            <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar nas respostas..."
            >

            <button id="atualizar" class="botao-atualizar" type="button">
                Atualizar respostas
            </button>

            <button id="excluirTodos" class="botao-excluir-todos" type="button">
                Excluir todas
            </button>

            <button id="sair"
